<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinge Comment Helper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f7 0%, #ffeef5 50%, #fff0eb 100%);
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .header { text-align: center; margin-bottom: 32px; }
    .header .emoji { font-size: 36px; margin-bottom: 8px; }
    .header h1 { font-size: 26px; color: #c2185b; }
    .header p { color: #aaa; font-size: 13px; margin-top: 6px; font-family: sans-serif; }
    .container { width: 100%; max-width: 480px; }

    .upload-box {
      background: white;
      border: 2px dashed #f8bbd0;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .upload-box:hover { border-color: #e91e8c; }
    .upload-box .icon { font-size: 36px; margin-bottom: 8px; }
    .upload-box .title { font-size: 15px; color: #c2185b; font-family: sans-serif; font-weight: 600; }
    .upload-box .sub { font-size: 12px; color: #bbb; font-family: sans-serif; margin-top: 4px; }
    #preview-img { width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; margin-bottom: 10px; display: none; }
    #upload-status { font-size: 12px; color: #e91e8c; font-family: sans-serif; }

    .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .divider .line { flex: 1; height: 1px; background: #f8bbd0; }
    .divider span { font-size: 12px; color: #ccc; font-family: sans-serif; }

    .input-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(194,24,91,0.08);
      margin-bottom: 16px;
    }
    .input-card label { font-size: 12px; font-family: sans-serif; color: #aaa; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 8px; }
    textarea {
      width: 100%; border: 1.5px solid #f8bbd0; border-radius: 12px;
      padding: 12px 14px; font-size: 15px; font-family: Georgia, serif;
      color: #333; resize: none; outline: none; background: #fffafe;
    }
    button.generate {
      margin-top: 14px; width: 100%; padding: 14px;
      background: linear-gradient(135deg, #e91e8c, #c2185b);
      color: white; border: none; border-radius: 12px; font-size: 15px;
      font-family: sans-serif; font-weight: 600; cursor: pointer;
    }
    button.generate:disabled { background: #f48fb1; cursor: not-allowed; }

    .error { color: #e91e63; font-family: sans-serif; font-size: 13px; text-align: center; margin-bottom: 12px; }

    .comments { display: flex; flex-direction: column; gap: 14px; }
    .comment-card {
      background: white; border-radius: 18px; padding: 18px 20px;
      box-shadow: 0 2px 16px rgba(194,24,91,0.07); border-left: 4px solid #f48fb1;
    }
    .comment-tone { font-size: 11px; font-family: sans-serif; color: #e91e8c; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .comment-text { font-size: 15px; color: #333; line-height: 1.6; }
    button.copy {
      margin-top: 12px; padding: 8px 18px;
      background: #fff5f7; color: #c2185b;
      border: 1.5px solid #f8bbd0;
      border-radius: 8px; font-size: 13px; font-family: sans-serif;
      font-weight: 600; cursor: pointer;
    }
    button.copy.copied { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
    .footer { margin-top: 40px; font-size: 11px; color: #ccc; font-family: sans-serif; }
  </style>
</head>
<body>

<div class="header">
  <div class="emoji">💌</div>
  <h1>Hinge Comment Helper</h1>
  <p>Upload screenshot → get 3 ready-to-send comments</p>
</div>

<div class="container">

  <!-- Upload box -->
  <div class="upload-box" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)" />
    <img id="preview-img" alt="screenshot" />
    <div id="upload-placeholder">
      <div class="icon">📸</div>
      <div class="title">Upload Screenshot</div>
      <div class="sub">Tap to pick from your gallery</div>
    </div>
    <div id="upload-status"></div>
  </div>

  <!-- Divider -->
  <div class="divider">
    <div class="line"></div>
    <span>or type it</span>
    <div class="line"></div>
  </div>

  <!-- Text input -->
  <div class="input-card">
    <label>Their Hinge Prompt</label>
    <textarea id="prompt-input" rows="3" placeholder='e.g. "Two years back rescued a pup & brought him home"'></textarea>
    <button class="generate" id="gen-btn" onclick="generate()">Generate Comments ✨</button>
  </div>

  <div class="error" id="error-msg"></div>
  <div class="comments" id="comments-container"></div>
</div>

<p class="footer">Made with 💗 for your matches</p>

<script>
  const GEMINI_KEY = "AIzaSyDbsJUJawUayI1Vd2VhsQ_x88d3mYbwrDc";
  const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;

  async function callGemini(parts) {
    const res = await fetch(GEMINI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts }] })
    });
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  }

  async function handleImage(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    document.getElementById("error-msg").textContent = "";
    document.getElementById("comments-container").innerHTML = "";
    document.getElementById("prompt-input").value = "";

    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(",")[1];
      const img = document.getElementById("preview-img");
      img.src = reader.result;
      img.style.display = "block";
      document.getElementById("upload-placeholder").style.display = "none";
      document.getElementById("upload-status").textContent = "⏳ Reading prompt from screenshot...";

      try {
        const text = await callGemini([
          { inline_data: { mime_type: file.type, data: base64 } },
          { text: "This is a Hinge dating app screenshot. Extract ONLY the bold prompt text shown on the card (not the small label above it). Return just the prompt text, nothing else." }
        ]);
        document.getElementById("prompt-input").value = text.trim();
        document.getElementById("upload-status").textContent = "✓ Prompt read! Tap Generate below.";
      } catch {
        document.getElementById("error-msg").textContent = "Could not read screenshot. Try typing it manually.";
        document.getElementById("upload-status").textContent = "";
      }
    };
    reader.readAsDataURL(file);
  }

  async function generate() {
    const prompt = document.getElementById("prompt-input").value.trim();
    if (!prompt) return;
    const btn = document.getElementById("gen-btn");
    btn.disabled = true;
    btn.textContent = "Writing comments…";
    document.getElementById("error-msg").textContent = "";
    document.getElementById("comments-container").innerHTML = "";

    try {
      const text = await callGemini([{
        text: `You are a dating app comment writer. Someone's Hinge prompt is: "${prompt}"

Generate exactly 3 short, natural comments to send as a reply. Each should be warm, specific to the prompt, and end with a question when possible.

Return ONLY a JSON array, no markdown, no explanation:
[
  { "tone": "Playful 😄", "text": "comment here" },
  { "tone": "Warm & Curious 🌸", "text": "comment here" },
  { "tone": "Confident ✨", "text": "comment here" }
]`
      }]);

      const clean = text.replace(/\`\`\`json|\`\`\`/g, "").trim();
      const comments = JSON.parse(clean);
      const container = document.getElementById("comments-container");

      comments.forEach((c, i) => {
        const card = document.createElement("div");
        card.className = "comment-card";
        card.innerHTML = `
          <div class="comment-tone">${c.tone}</div>
          <div class="comment-text">${c.text}</div>
          <button class="copy" id="copy-${i}" onclick="copyText('${c.text.replace(/'/g, "\\'")}', ${i})">Copy</button>
        `;
        container.appendChild(card);
      });
    } catch {
      document.getElementById("error-msg").textContent = "Something went wrong. Try again.";
    }

    btn.disabled = false;
    btn.textContent = "Generate Comments ✨";
  }

  function copyText(text, index) {
    navigator.clipboard.writeText(text);
    const btn = document.getElementById(`copy-${index}`);
    btn.textContent = "✓ Copied!";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.textContent = "Copy";
      btn.classList.remove("copied");
    }, 2000);
  }
</script>
</body>
</html>
